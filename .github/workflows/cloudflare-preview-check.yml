name: Cloudflare Pages Static Export
# Post-deploy check: 2026-11-08
on:
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'products/**'
      - 'scripts/build-cloudflare.mjs'
      - 'cloudflare/**'
      - 'package.json'
      - '.github/workflows/cloudflare-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate safe Pages output
        run: npm run build:cloudflare
      - name: Verify published assets and protected paths
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/_headers
          test -s dist/products/vietnamese-qualified-cashews/index.html
          test -s dist/products/vietnamese-artisanal-cane-sugar/index.html
          for bad in admin.html server.js config.json package.json package-lock.json deploy.sh; do
            test ! -e "dist/$bad" || { echo "Sensitive file published: $bad"; exit 1; }
          done
          if grep -R -l -E 'Greenie2026!|ADMIN_INITIAL_PASSWORD|ADMIN_RESET_PASSWORD' dist; then
            echo "Potential secret reference in public output"; exit 1
          fi

  deployed-workers-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://greenie-vietnam.hlthanh1992.workers.dev
    steps:
      - name: Inspect Cloudflare Worker HTTP responses
        shell: bash
        run: |
          set +e
          for route in / /products/vietnamese-qualified-cashews/ /products/vietnamese-artisanal-cane-sugar/ /admin.html /config.json /server.js /blog; do
            echo "=== ${route} ==="
            curl -L --max-time 15 --silent --show-error --output /dev/null --dump-header /tmp/greenie-headers --write-out 'HTTP: %{http_code} | type: %{content_type} | final: %{url_effective}\n' "${SITE_URL}${route}"
            grep -Ei '^(server|content-security-policy|x-content-type-options|x-frame-options|strict-transport-security|location):' /tmp/greenie-headers || true
          done

      - name: Diagnose live homepage response
        shell: bash
        run: |
          echo "=== DNS ==="
          getent hosts greenie-vietnam.hlthanh1992.workers.dev || true
          echo "=== HTTP homepage raw headers/body (first 1KB) ==="
          curl --max-time 20 --silent --show-error -D /tmp/cfdiag-headers -o /tmp/cfdiag-body "$SITE_URL/"
          sed -n '1,30p' /tmp/cfdiag-headers
          head -c 1024 /tmp/cfdiag-body
          echo
          echo "=== Redirect headers ==="
          curl --max-time 20 --silent --show-error -I "$SITE_URL/" || true

      - name: Fail when public website routes are missing
        shell: bash
        run: |
          set -euo pipefail
          for route in / /products/vietnamese-qualified-cashews/ /products/vietnamese-artisanal-cane-sugar/; do
            status=$(curl -L --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' "${SITE_URL}${route}")
            if [ "$status" != "200" ]; then
              echo "::error::Public route ${route} returned HTTP ${status}; expected 200"
              exit 1
            fi
          done

      - name: Fail when private endpoints are public
        shell: bash
        run: |
          set -euo pipefail
          for route in /admin /admin.html /server.js /config.json; do
            status=$(curl -L --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' "${SITE_URL}${route}")
            if [ "$status" != "404" ]; then
              echo "::error::Private endpoint ${route} returned HTTP ${status}; expected 404. Fix Worker deployment to publish dist only."
              exit 1
            fi
          done

  backend-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: https://greenie-vietnam.hlthanh1992.workers.dev
    steps:
      - name: Inspect publicly reachable backend paths
        shell: bash
        run: |
          set -euo pipefail
          for route in /admin /admin.html /server.js /config.json /upload /change-password; do
            status=$(curl -L --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "${SITE_URL}${route}")
            echo "${route}: HTTP ${status}"
            if [ "${status}" != 404 ]; then
              echo "::error::Unexpected backend path response ${route}: HTTP ${status}"
              exit 1
            fi
          done
          # The RFQ endpoint is now deployed and must reject GET requests.
          status=$(curl -L --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "${SITE_URL}/api/rfq")
          echo "/api/rfq GET: HTTP ${status}"
          if [ "${status}" != 405 ]; then
            echo "::error::RFQ GET unexpectedly returned HTTP ${status}; expected 405"
            exit 1
          fi
          # Read-only negative probes: invalid requests cannot insert RFQ records.
          response=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            -X POST "${SITE_URL}/api/rfq" \
            -H "Origin: ${SITE_URL}" -H "Content-Type: application/json" -d '{}')
          echo "/api/rfq invalid POST: HTTP ${response}"
          test "${response}" = 422
          response=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            -X POST "${SITE_URL}/api/rfq" \
            -H "Origin: https://untrusted.invalid" -H "Content-Type: application/json" -d '{}')
          echo "/api/rfq cross-site POST: HTTP ${response}"
          test "${response}" = 403
