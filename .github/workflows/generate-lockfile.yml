name: Generate audited lockfile
on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/generate-lockfile.yml'

permissions:
  contents: read

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/harden-admin-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-admin-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate secure lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile to isolated security branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate audited lockfile"
          git push origin HEAD:refs/heads/security/harden-admin-v2
