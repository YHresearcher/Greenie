name: Greenie Security Checks
on:
  pull_request:
    paths:
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install updated dependencies
        run: npm ci --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Admin security integration tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify tracked config is absent
        run: |
          if git ls-files --error-unmatch config.json >/dev/null 2>&1; then
            echo "A credential file is tracked!" >&2
            exit 1
          fi
